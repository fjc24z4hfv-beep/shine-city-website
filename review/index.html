<head>

  <meta property="og:description" content="Thanks for choosing Shine City Paver Sealing &amp; Exterior Cleaning! Tap to leave a quick Google review.">
  <meta property="og:url" content="https://shinecitypaversealing.com/review/">
  <meta property="og:image" content="https://shinecitypaversealing.com/review/og-image.png">

  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">

  <!-- Twitter / X card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Leave Shine City a Review">
  <meta name="twitter:description" content="Thanks for choosing Shine City Paver Sealing &amp; Exterior Cleaning! Tap to leave a quick Google review.">
  <meta name="twitter:image" content="https://shinecitypaversealing.com/review/og-image.png">

  <link rel="canonical" href="https://shinecitypaversealing.com/review/">
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">

  <style>
    :root {
      --blue: #31A3FE;      /* sampled from logo */
      --blue-dark: #1E8FEA;
      --blue-soft: #E8F4FF;
      --navy: #0E2A52;
      --white: #FFFFFF;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      min-height: 100vh; min-height: 100dvh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      color: var(--navy);
      background: linear-gradient(180deg, var(--white) 0%, var(--white) 35%, var(--blue-soft) 100%);
      display: flex; flex-direction: column; align-items: center;
      -webkit-font-smoothing: antialiased;
    }
    main {
      width: 100%; max-width: 440px; flex: 1;
      padding: max(28px, env(safe-area-inset-top)) 24px 24px;
      display: flex; flex-direction: column; align-items: center; text-align: center;
    }
    .logo { width: 82%; max-width: 320px; height: auto; margin: 8px auto 4px; }
    .formerly { font-size: 13px; color: #5B6F8C; margin: 0 0 26px; letter-spacing: .2px; }
    h1 { font-size: 27px; line-height: 1.2; margin: 0 0 12px; font-weight: 800; color: var(--navy); }
    .lede { font-size: 17px; line-height: 1.5; margin: 0 0 30px; color: #2E4566; }
    .btn {
      display: block; width: 100%;
      padding: 18px 20px;
      background: var(--blue); color: var(--white);
      font-size: 19px; font-weight: 700; text-decoration: none;
      border-radius: 14px;
      box-shadow: 0 8px 20px rgba(49,163,254,.35), inset 0 -3px 0 rgba(0,0,0,.08);
      transition: transform .08s ease, background .15s ease;
    }
    .btn:hover { background: var(--blue-dark); }
    .btn:active { transform: translateY(1px) scale(.99); }
    .btn .stars { display: block; font-size: 20px; margin-top: 6px; letter-spacing: 2px; }
    .redirect-note { font-size: 13px; color: #5B6F8C; margin: 16px 0 0; min-height: 1.4em; }
    .redirect-note button {
      background: none; border: 0; padding: 0; font: inherit; color: var(--blue-dark);
      text-decoration: underline; cursor: pointer;
    }
    footer {
      width: 100%; max-width: 440px;
      padding: 18px 24px max(22px, env(safe-area-inset-bottom));
      text-align: center; font-size: 14px; color: #5B6F8C;
      border-top: 1px solid rgba(14,42,82,.08);
    }
    footer strong { color: var(--navy); font-weight: 700; }
    footer a { color: var(--navy); font-weight: 700; text-decoration: none; }
  </style>
</head>
<body>
  <main>
    <img class="logo" src="logo.png" width="360" height="296"
         alt="Shine City Paver Sealing &amp; Exterior Cleaning">
    <p class="formerly">formerly Revive Exterior Cleaning</p>

    <h1>Thanks for choosing Shine&nbsp;City!</h1>
    <p class="lede">Your review helps a local, family-run business. It only takes a minute.</p>

    <a id="review-btn" class="btn"
       href="https://search.google.com/local/writereview?placeid=ChIJhw8ynC9JzigRu_68uv9DBQM"
       rel="noopener">
      Leave a Google Review
      <span class="stars" aria-hidden="true">⭐⭐⭐⭐⭐</span>
    </a>

    <p class="redirect-note" id="redirect-note" aria-live="polite"></p>
  </main>

  <footer>
    <strong>Shine City Paver Sealing &amp; Exterior Cleaning</strong><br>
    <a href="tel:+13217950313">(321) 795-0313</a>
  </footer>

  <script>
    // Optional gentle auto-redirect (JS only — no <meta refresh>, so link-preview
    // crawlers stay on this page and read the Open Graph tags).
    // Disable by adding ?stay to the URL, or set REDIRECT_SECONDS = 0.
    (function () {
      var REDIRECT_SECONDS = 4;
      var url = document.getElementById('review-btn').href;
      var note = document.getElementById('redirect-note');
      if (!REDIRECT_SECONDS || /[?&]stay\b/.test(location.search)) return;
      // Only auto-redirect once per tab, so "Back" from Google doesn't bounce them again.
      try { if (sessionStorage.getItem('sc_redirected')) return; } catch (e) {}
      var left = REDIRECT_SECONDS, timer;
      function render() {
        note.innerHTML = 'Opening Google in ' + left + '… <button type="button" id="stay">Stay here</button>';
        document.getElementById('stay').onclick = function () { clearInterval(timer); note.textContent = ''; };
      }
      render();
      timer = setInterval(function () {
        left -= 1;
        if (left > 0) { render(); return; }
        clearInterval(timer);
        try { sessionStorage.setItem('sc_redirected', '1'); } catch (e) {}
        note.textContent = 'Opening Google…';
        window.location.assign(url);
      }, 1000);
    })();
  </script>
</body>
</html>
